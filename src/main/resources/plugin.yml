name: ExplosionGuard
version: '1.2.1'
main: com.sunglogbag81.explosionguard.ExplosionGuardPlugin
api-version: '26.3'
author: sunglogbag81
description: Overworld explosion visuals with original world blocks and temporary client barriers.
softdepend: [BlockLocker, WorldShield]
commands:
  explosionguard:
    description: 폭발 복구 연출 관리
    usage: /explosionguard [status|restore|reload]
    permission: explosionguard.admin
permissions:
  explosionguard.admin:
    default: op
